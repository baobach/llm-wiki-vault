name: CI

# Every push and pull request: static checks, then the end-to-end tests on
# Linux and macOS with the oldest and newest supported Python.
# Push to main with a new VERSION: tag vX.Y.Z, publish the GitHub release from
# CHANGELOG.md, and install from the new tag with the one-line command.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        run: shellcheck install.sh tests/*.sh

      - name: Ruff
        run: pipx run ruff==0.14.0 check --target-version py39 tools/

      - name: Versions, docs, and assets agree
        run: bash tests/check_release.sh

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install, update, linter, and index tests
        run: bash tests/run.sh

  # A tag pushed with GITHUB_TOKEN starts no new workflow run, so this job
  # tags, publishes, and smoke-tests in one place.
  release:
    name: Release
    needs: [checks, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for an unreleased version
        id: version
        run: |
          version="$(cat VERSION)"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "tag=v$version" >>"$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "new=false" >>"$GITHUB_OUTPUT"
            echo "v$version is already released, nothing to do"
          else
            echo "new=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Tag and publish
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          bash tests/release_notes.sh "$VERSION" >"$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "llm-wiki-vault $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - name: One-line install from the new tag
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://raw.githubusercontent.com/${{ github.repository }}/$TAG/install.sh"
          for _ in 1 2 3 4 5; do curl -fsSL "$url" -o "$RUNNER_TEMP/install.sh" && break; sleep 10; done
          bash "$RUNNER_TEMP/install.sh" --no-git "$RUNNER_TEMP/vault"
          test -f "$RUNNER_TEMP/vault/.claude/skills/digest/SKILL.md"
          test -f "$RUNNER_TEMP/vault/wiki_index.py"
          test "$(cat "$RUNNER_TEMP/vault/.llm-wiki-vault-version")" = "$VERSION"

  # Same smoke test for a tag a person pushes by hand.
  release-smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: One-line install from the tag
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh" \
            | bash -s -- --no-git "$RUNNER_TEMP/vault"
          test -f "$RUNNER_TEMP/vault/.claude/skills/digest/SKILL.md"
          test "$(cat "$RUNNER_TEMP/vault/.llm-wiki-vault-version")" = "${GITHUB_REF_NAME#v}"
