name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck
        if: runner.os == 'Linux'
        run: shellcheck install.sh tests/run.sh

      - name: Tests
        run: bash tests/run.sh

  # On a release tag, install with the published one-line command.
  release-smoke:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: One-line install from the tag
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/install.sh" \
            | bash -s -- --no-git "$RUNNER_TEMP/vault"
          test -f "$RUNNER_TEMP/vault/.claude/skills/digest/SKILL.md"
          test "$(cat "$RUNNER_TEMP/vault/.llm-wiki-vault-version")" = "${GITHUB_REF_NAME#v}"
